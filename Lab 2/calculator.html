<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Sora:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="calc" aria-label="Calculator">
    <div class="lcd" role="status" aria-live="polite">
      <div class="lcd__history" id="history"></div>
      <div class="lcd__ghost" aria-hidden="true">888888888</div>
      <output class="lcd__value" id="display">0</output>
    </div>

    <div class="keys" id="keys">
      <button class="key key--clear" data-action="clear" aria-label="Clear all">AC</button>
      <button class="key key--fn" data-action="backspace" aria-label="Delete last digit">⌫</button>
      <button class="key key--fn" data-action="percent" aria-label="Percent">%</button>
      <button class="key key--op" data-op="/" aria-label="Divide">÷</button>

      <button class="key" data-num="7">7</button>
      <button class="key" data-num="8">8</button>
      <button class="key" data-num="9">9</button>
      <button class="key key--op" data-op="*" aria-label="Multiply">×</button>

      <button class="key" data-num="4">4</button>
      <button class="key" data-num="5">5</button>
      <button class="key" data-num="6">6</button>
      <button class="key key--op" data-op="-" aria-label="Subtract">−</button>

      <button class="key" data-num="1">1</button>
      <button class="key" data-num="2">2</button>
      <button class="key" data-num="3">3</button>
      <button class="key key--op" data-op="+" aria-label="Add">+</button>

      <button class="key key--fn" data-action="sign" aria-label="Toggle sign">±</button>
      <button class="key" data-num="0">0</button>
      <button class="key" data-action="dot" aria-label="Decimal point">.</button>
      <button class="key key--equals" data-action="equals" aria-label="Equals">=</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
